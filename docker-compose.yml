# Local development stack for coretraining-web-wordpress.
#
# Production (tcpro / Docker Swarm) uses infrsastructure-ds/cust/pri.yml
# and does NOT bind-mount the theme - the theme is baked into the image.

services:
  wordpress:
    build: .
    image: coretraining-web:dev
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: coretraining
      WORDPRESS_DB_USER: coretraining
      WORDPRESS_DB_PASSWORD: coretraining
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
      # GTM_CONTAINER_ID: GTM-XXXXXXX   # theme reads it via getenv() in functions.php
    volumes:
      # Bind-mount ONLY the custom theme - everything else (WP core, plugins) comes from the image.
      - ./wp-content/themes/coretraining:/var/www/html/wp-content/themes/coretraining
      # Uploads persist across `docker compose down`. Use `down -v` to wipe.
      - uploads:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    # Keep aligned with production (infrsastructure-ds/cust/pri.yml uses mysql:8.0).
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: coretraining
      MYSQL_USER: coretraining
      MYSQL_PASSWORD: coretraining
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 20

volumes:
  uploads:
  db:
